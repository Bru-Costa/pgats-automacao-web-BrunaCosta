name: Testes E2E - Automation Exercise

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Execução agendada a cada 7 minutos (horário UTC)
  schedule:
    - cron: '*/7 * * * *'
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

# Evita que uma execução agendada comece enquanto a anterior ainda está rodando
concurrency:
  group: testes-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Cypress (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Executar os testes
        run: npm test

      - name: Publicar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: cypress/reports
          if-no-files-found: warn
          retention-days: 30
